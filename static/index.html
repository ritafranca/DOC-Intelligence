<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DOC Intelligence — processamento e conferência inteligente de documentos internos." />
  <title>DOC Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deep: '#121212', surface: '#1E1E1E', elevated: '#252525', gold: '#D4AF37',
            ink: '#121212', navy: '#181818', cyan: '#D4AF37', paper: '#121212',
            line: '#38342A', muted: '#A8A39A', amber: '#D4AF37', danger: '#FF7B72', mint: '#69D394'
          },
          fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          boxShadow: {
            panel: '0 16px 45px rgba(0, 0, 0, .24)',
            float: '0 30px 90px rgba(0, 0, 0, .58)',
            gold: '0 0 0 1px rgba(212,175,55,.18), 0 20px 60px rgba(0,0,0,.32)'
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 86% -10%, rgba(212, 175, 55, .07), transparent 32rem),
        #121212;
      color: #E0E0E0;
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    input, select, textarea { color-scheme: dark; }
    ::selection { background: #D4AF37; color: #121212; }
    .drop-grid {
      background-image: radial-gradient(rgba(212, 175, 55, .11) .7px, transparent .7px);
      background-size: 18px 18px;
    }
    .scrollbar-thin { scrollbar-color: #5f5949 transparent; scrollbar-width: thin; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes quietGlow {
      0%, 100% { box-shadow: inset 0 0 0 1px rgba(212,175,55,.02), 0 0 0 rgba(212,175,55,0); }
      50% { box-shadow: inset 0 0 0 1px rgba(212,175,55,.08), 0 0 34px rgba(212,175,55,.055); }
    }
    @keyframes successPop {
      0% { opacity: 0; transform: scale(.65); }
      65% { transform: scale(1.16); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes progressSweep { from { transform: translateX(-100%); } to { transform: translateX(160%); } }
    .spin { animation: spin 1s linear infinite; }
    .enter { animation: enter .24s ease-out both; }
    .drawer-enter { animation: slideIn .24s ease-out both; }
    .success-pop { animation: successPop .38s cubic-bezier(.22,1,.36,1) both; }
    .upload-progress { animation: progressSweep 1.35s ease-in-out infinite; }
    .dropzone-idle { animation: quietGlow 4.5s ease-in-out infinite; }
    .dropzone-active { box-shadow: inset 0 0 0 1px rgba(212,175,55,.32), 0 20px 70px rgba(212,175,55,.09); }
    .focus-ring:focus-visible { outline: 2px solid rgba(212,175,55,.82); outline-offset: 3px; }
    .document-canvas { background-color: #161616; background-image: radial-gradient(#3b382f 1px, transparent 1px); background-size: 18px 18px; }
    .luxury-rule { background: linear-gradient(90deg, transparent, rgba(212,175,55,.72), transparent); }

    /* Mantém as telas operacionais legadas coerentes com o tema escuro. */
    body .bg-white { background-color: #1E1E1E !important; }
    body .bg-slate-50, body .bg-slate-100 { background-color: #252525 !important; }
    body .bg-slate-200 { background-color: #353535 !important; }
    body .text-slate-300 { color: #B5B0A7 !important; }
    body .text-slate-400, body .text-slate-500, body .text-slate-600, body .text-slate-700 { color: #A8A39A !important; }
    body .text-ink { color: #E0E0E0 !important; }
    body .border-slate-200, body .border-slate-300 { border-color: #3A372F !important; }
    body .text-cyan-700, body .text-cyan-800 { color: #D4AF37 !important; }
    body .bg-cyan { background-color: #D4AF37 !important; }
    body .bg-amber-50, body .bg-amber-100 { background-color: rgba(212,175,55,.10) !important; }
    body .border-amber-200 { border-color: rgba(212,175,55,.30) !important; }
    body .text-amber-700, body .text-amber-800, body .text-amber-900 { color: #E1C567 !important; }
    body .bg-emerald-50 { background-color: rgba(52,211,153,.09) !important; }
    body .border-emerald-200 { border-color: rgba(52,211,153,.22) !important; }
    body .text-emerald-600, body .text-emerald-700, body .text-emerald-800 { color: #6EE7B7 !important; }
    body .bg-red-50 { background-color: rgba(248,113,113,.09) !important; }
    body .border-red-200 { border-color: rgba(248,113,113,.25) !important; }
    body .hover\:bg-slate-50:hover, body .hover\:bg-slate-100:hover { background-color: #292929 !important; }
    option { background: #1E1E1E; color: #E0E0E0; }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr !important; }
      .sidebar { position: static !important; height: auto !important; padding: 16px !important; }
      .nav-row { display: grid !important; grid-template-columns: repeat(4, minmax(0,1fr)); margin-top: 14px !important; }
      .nav-row button { justify-content: center; padding: 10px 6px !important; }
      .nav-row button span.nav-label { display: none; }
      .sidebar-profile { display: none !important; }
      .review-grid { grid-template-columns: 1fr !important; }
      .review-preview { border-right: 0 !important; border-bottom: 1px solid #38342A; }
      .desk-metrics { display: none !important; }
    }
    @media (max-width: 640px) {
      .page-pad { padding: 20px 16px !important; }
      .upload-row { align-items: flex-start !important; }
      .drawer-panel { width: 100vw !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useCallback, useEffect, useMemo, useRef, useState } from 'https://esm.sh/react@19.1.1';
    import { createRoot } from 'https://esm.sh/react-dom@19.1.1/client';
    import htm from 'https://esm.sh/htm@3.1.1';
    import { UserManager, WebStorageStateStore } from 'https://esm.sh/oidc-client-ts@3.3.0';
    import {
      Activity, AlertCircle, AlertTriangle, ArrowRight, Check, CheckCircle2, ChevronRight,
      ClipboardCheck, Clock3, Download, ExternalLink, Eye, FileCheck2, FileImage, FileSearch,
      Files, Filter, Inbox, Layers3, LoaderCircle, LogIn, LogOut, LockKeyhole, Mail, MoreHorizontal,
      Plus, RefreshCw, RotateCcw, Search, ShieldCheck, Sparkles, Trash2, UploadCloud, UserRound,
      X, XCircle, Zap
    } from 'https://esm.sh/lucide-react@0.468.0';

    const html = htm.bind(React.createElement);
    const TERMINAL = new Set(['COMPLETED', 'NEEDS_REVIEW', 'FAILED', 'PURGED']);
    const STATUS = {
      PENDING: { label: 'Na fila', className: 'bg-white/5 text-[#B9B4AA] border-white/10', icon: Clock3 },
      PROCESSING: { label: 'Em triagem', className: 'bg-gold/10 text-gold border-gold/30', icon: LoaderCircle },
      COMPLETED: { label: 'Concluído', className: 'bg-emerald-400/10 text-emerald-300 border-emerald-400/20', icon: CheckCircle2 },
      NEEDS_REVIEW: { label: 'Conferência', className: 'bg-amber/10 text-[#E5CA72] border-amber/30', icon: AlertTriangle },
      FAILED: { label: 'Falha', className: 'bg-red-400/10 text-red-300 border-red-400/20', icon: XCircle },
      PURGED: { label: 'Descartado', className: 'bg-white/5 text-[#8E8A82] border-white/10', icon: ShieldCheck }
    };
    const CHANNELS = { whatsapp: 'WhatsApp', email: 'E-mail', balcao: 'Balcão', internal: 'Sistema interno' };
    const ACCEPTED_TYPES = new Set(['image/jpeg', 'image/png', 'application/pdf']);
    const MAX_FILE_SIZE = 20 * 1024 * 1024;

    function formatDate(value) {
      if (!value) return '—';
      return new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(value));
    }

    function formatBytes(value) {
      if (!Number.isFinite(value)) return '—';
      if (value < 1024) return `${value} B`;
      if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
      return `${(value / (1024 * 1024)).toFixed(1)} MB`;
    }

    function relativeTime(value) {
      if (!value) return 'agora';
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
      if (seconds < 60) return 'há instantes';
      if (seconds < 3600) return `há ${Math.floor(seconds / 60)} min`;
      if (seconds < 86400) return `há ${Math.floor(seconds / 3600)} h`;
      return `há ${Math.floor(seconds / 86400)} d`;
    }

    function fileIcon(mimeType, size = 20) {
      return mimeType === 'application/pdf' ? html`<${Files} size=${size} />` : html`<${FileImage} size=${size} />`;
    }

    function StatusBadge({ status }) {
      const item = STATUS[status] || STATUS.PENDING;
      const Icon = item.icon;
      return html`<span className=${`inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs font-semibold ${item.className}`}>
        <${Icon} size=${13} className=${status === 'PROCESSING' ? 'spin' : ''} />${item.label}
      </span>`;
    }

    function apiClient(accessToken, developmentAuth = false) {
      return async (path, options = {}) => {
        const headers = new Headers(options.headers || {});
        if (accessToken) headers.set('Authorization', `Bearer ${accessToken}`);
        if (developmentAuth) {
          headers.set('X-Dev-User', 'dev.operator');
          headers.set('X-Dev-Roles', 'document.submit,document.read,document.review,document.admin');
        }
        const response = await fetch(path, { ...options, headers });
        if (!response.ok) {
          let message = `Erro ${response.status}`;
          try { message = (await response.json()).detail || message; } catch (_) {}
          throw new Error(message);
        }
        if (response.status === 204) return null;
        return response.json();
      };
    }

    function Sidebar({ view, setView, principal, onSignOut, reviewCount, activeCount }) {
      const canReview = principal.roles.includes('document.review') || principal.roles.includes('document.admin');
      const nav = [
        { id: 'upload', label: 'Anexar documentos', icon: UploadCloud },
        { id: 'monitor', label: 'Triagem ativa', icon: Activity, count: activeCount },
        ...(canReview ? [{ id: 'review', label: 'Fila de conferência', icon: ClipboardCheck, count: reviewCount }] : []),
        { id: 'documents', label: 'Acervo processual', icon: Files }
      ];
      return html`<aside className="sidebar sticky top-0 z-20 flex h-screen flex-col border-r border-gold/10 bg-[#0D0D0D] px-5 py-6 text-[#E0E0E0]">
        <div className="flex items-center gap-3 border-b border-gold/15 pb-6">
          <div className="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-gold/40 bg-gold/10 text-gold shadow-[inset_0_0_18px_rgba(212,175,55,.06)]"><${FileSearch} size=${23} strokeWidth=${1.8} /></div>
          <div className="min-w-0"><div className="text-[9px] font-bold uppercase tracking-[.28em] text-gold/80">Núcleo documental</div><h1 className="mt-1 truncate text-base font-semibold tracking-tight">DOC Intelligence</h1></div>
        </div>

        <div className="mt-6 px-3 text-[9px] font-bold uppercase tracking-[.22em] text-[#706B62]">Espaço de trabalho</div>
        <nav className="nav-row mt-3 flex flex-col gap-1.5" aria-label="Navegação principal">
          ${nav.map(item => html`<button type="button" key=${item.id} onClick=${() => setView(item.id)} aria-label=${item.label} aria-current=${view === item.id ? 'page' : undefined} className=${`focus-ring group relative flex items-center gap-3 rounded-xl border px-3.5 py-3 text-left text-[13px] font-semibold transition duration-200 ${view === item.id ? 'border-gold/15 bg-gold/10 text-gold' : 'border-transparent text-[#9D988F] hover:bg-white/[.04] hover:text-[#E0E0E0]'}`}>
            ${view === item.id ? html`<span className="absolute -left-[21px] h-7 w-[2px] rounded-r bg-gold shadow-[0_0_12px_rgba(212,175,55,.6)]"></span>` : null}
            <${item.icon} size=${17} strokeWidth=${view === item.id ? 2 : 1.7} /><span className="nav-label flex-1">${item.label}</span>
            ${item.count ? html`<span className="rounded-full border border-gold/25 bg-gold/10 px-2 py-0.5 text-[10px] font-bold text-gold">${item.count}</span>` : null}
          </button>`)}
        </nav>

        <div className="sidebar-profile mt-auto space-y-4 border-t border-gold/10 pt-5">
          <div className="flex items-center gap-3"><div className="grid h-9 w-9 place-items-center rounded-full border border-gold/20 bg-gold/[.07] text-gold"><${UserRound} size=${16} /></div><div className="min-w-0 flex-1"><div className="truncate text-xs font-semibold">${principal.name || principal.email || principal.subject}</div><div className="mt-0.5 truncate text-[10px] text-[#777168]">Acesso individual auditado</div></div></div>
          <button type="button" onClick=${onSignOut} className="focus-ring flex w-full items-center justify-center gap-2 rounded-xl border border-white/10 px-3 py-2.5 text-[11px] font-semibold text-[#9D988F] transition hover:border-gold/35 hover:text-gold"><${LogOut} size=${13} /> Encerrar sessão</button>
          <div className="flex items-center gap-2 text-[10px] text-[#777168]"><${ShieldCheck} size=${13} className="text-gold/70" /> Ambiente jurídico protegido</div>
        </div>
      </aside>`;
    }

    function Metric({ label, value, icon: Icon }) {
      return html`<div className="group min-w-[150px] rounded-xl border border-white/[.07] bg-surface px-4 py-3 shadow-panel transition duration-200 hover:border-gold/25">
        <div className="flex items-center justify-between gap-4"><div><div className="text-[9px] font-bold uppercase tracking-[.18em] text-[#8D887F]">${label}</div><div className="mt-1 text-2xl font-semibold tabular-nums text-gold">${value}</div></div><div className="grid h-9 w-9 place-items-center rounded-lg border border-gold/15 bg-gold/[.06] text-gold/80"><${Icon} size=${16} strokeWidth=${1.7} /></div></div>
      </div>`;
    }

    function UploadView({ api, onUploaded, onTrack }) {
      const [files, setFiles] = useState([]);
      const [channel, setChannel] = useState('whatsapp');
      const [dragging, setDragging] = useState(false);
      const [sending, setSending] = useState(false);
      const inputRef = useRef(null);

      const addFiles = selected => {
        const incoming = [...selected].map(file => {
          let message = '';
          if (!ACCEPTED_TYPES.has(file.type)) message = 'Formato não aceito. Use JPEG, PNG ou PDF.';
          else if (file.size > MAX_FILE_SIZE) message = 'Arquivo maior que 20 MB.';
          return { id: crypto.randomUUID(), file, state: message ? 'invalid' : 'ready', message };
        });
        setFiles(previous => {
          const existing = new Set(previous.map(item => `${item.file.name}:${item.file.size}:${item.file.lastModified}`));
          return [...previous, ...incoming.filter(item => !existing.has(`${item.file.name}:${item.file.size}:${item.file.lastModified}`))];
        });
        if (inputRef.current) inputRef.current.value = '';
      };

      const uploadAll = async () => {
        const pending = files.filter(item => item.state === 'ready' || item.state === 'error');
        if (!pending.length) return;
        setSending(true);
        let cursor = 0;
        const uploadOne = async item => {
          setFiles(current => current.map(entry => entry.id === item.id ? { ...entry, state: 'uploading', message: 'Enviando com segurança…' } : entry));
          const data = new FormData();
          data.append('file', item.file);
          data.append('source_channel', channel);
          try {
            const result = await api('/api/v1/documents', { method: 'POST', body: data });
            setFiles(current => current.map(entry => entry.id === item.id ? { ...entry, state: result.duplicate ? 'duplicate' : 'done', message: result.duplicate ? 'Reenvio identificado; processamento existente reutilizado.' : 'Recebido e encaminhado para processamento.', document: result.document, duplicate: result.duplicate } : entry));
          } catch (error) {
            setFiles(current => current.map(entry => entry.id === item.id ? { ...entry, state: 'error', message: error.message } : entry));
          }
        };
        const worker = async () => {
          while (cursor < pending.length) {
            const item = pending[cursor++];
            await uploadOne(item);
          }
        };
        await Promise.all(Array.from({ length: Math.min(3, pending.length) }, worker));
        setSending(false);
        await onUploaded();
      };

      const readyCount = files.filter(item => item.state === 'ready' || item.state === 'error').length;
      const successCount = files.filter(item => ['done', 'duplicate'].includes(item.state)).length;
      const remove = id => setFiles(current => current.filter(item => item.id !== id));

      return html`<section className="enter mx-auto max-w-6xl">
        <div className="mb-8 grid items-end gap-6 lg:grid-cols-[1fr_auto]">
          <div><div className="mb-4 inline-flex items-center gap-2 rounded-full border border-gold/20 bg-gold/[.06] px-3 py-1.5 text-[9px] font-bold uppercase tracking-[.22em] text-gold"><${ShieldCheck} size=${12} /> Inteligência documental jurídica</div><h2 className="max-w-3xl text-3xl font-semibold leading-tight tracking-[-.035em] text-[#ECE9E2] sm:text-4xl">Prepare documentos para o processo,<br className="hidden sm:block" /> com precisão e rastreabilidade.</h2><p className="mt-4 max-w-2xl text-sm leading-6 text-[#99948B]">Anexe provas, documentos pessoais, contratos, laudos ou certidões. A triagem identifica, organiza e extrai os dados relevantes para a equipe jurídica.</p></div>
          <label className="rounded-xl border border-white/[.07] bg-surface p-3 text-[9px] font-bold uppercase tracking-[.16em] text-[#8D887F] shadow-panel">Origem dos documentos
            <select value=${channel} disabled=${sending} onChange=${e => setChannel(e.target.value)} className="focus-ring mt-2 block min-w-[210px] rounded-lg border border-gold/15 bg-[#181818] px-3 py-2.5 text-xs font-semibold normal-case tracking-normal text-[#E0E0E0] outline-none transition hover:border-gold/35 disabled:opacity-50">
              <option value="whatsapp">WhatsApp do cliente</option><option value="email">E-mail</option><option value="balcao">Atendimento presencial</option><option value="internal">Sistema interno</option>
            </select>
          </label>
        </div>

        <div role="button" tabIndex="0" aria-label="Anexar autos ou documentos" onKeyDown=${e => { if (['Enter', ' '].includes(e.key)) inputRef.current?.click(); }} onDragOver=${e => { e.preventDefault(); setDragging(true); }} onDragLeave=${e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragging(false); }} onDrop=${e => { e.preventDefault(); setDragging(false); addFiles(e.dataTransfer.files); }} className=${`focus-ring drop-grid relative isolate overflow-hidden rounded-2xl border-2 p-10 text-center transition-all duration-300 sm:p-14 ${dragging ? 'dropzone-active scale-[1.006] border-solid border-gold bg-gold/[.08]' : 'dropzone-idle border-dashed border-gold/55 bg-surface hover:border-gold/80 hover:bg-[#211F1A]'}`}>
          <div className=${`pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(212,175,55,.09),transparent_60%)] transition-opacity duration-300 ${dragging ? 'opacity-100' : 'opacity-25'}`}></div>
          <div className="relative z-10"><div className=${`mx-auto mb-5 grid h-20 w-20 place-items-center rounded-2xl border text-gold transition-all duration-300 ${dragging ? 'scale-110 border-gold bg-gold/15 shadow-[0_0_38px_rgba(212,175,55,.18)]' : 'border-gold/25 bg-gold/[.07]'}`}><${UploadCloud} size=${32} strokeWidth=${1.6} /></div><p className="text-[10px] font-bold uppercase tracking-[.22em] text-gold/80">Anexar autos / documentos</p><h3 className="mt-3 text-xl font-semibold tracking-tight text-[#ECE9E2] sm:text-2xl">${dragging ? 'Solte para incluir na triagem' : 'Arraste os arquivos para esta área'}</h3><p className="mt-2 text-sm text-[#8F8A82]">PDF, JPEG ou PNG · até 20 MB por arquivo · envio em lote</p><div className="my-6 flex items-center justify-center gap-3"><span className="h-px w-12 bg-white/10"></span><span className="text-[9px] font-bold uppercase tracking-[.18em] text-[#625E57]">ou</span><span className="h-px w-12 bg-white/10"></span></div><button type="button" onClick=${e => { e.stopPropagation(); inputRef.current?.click(); }} className="focus-ring inline-flex items-center gap-2 rounded-xl bg-gold px-5 py-3 text-xs font-extrabold text-[#121212] shadow-[0_10px_30px_rgba(212,175,55,.12)] transition duration-200 hover:bg-[#E3C55C] hover:shadow-[0_12px_36px_rgba(212,175,55,.22)]"><${Plus} size=${16} strokeWidth=${2.2} /> Selecionar documentos</button><input ref=${inputRef} type="file" multiple accept=".jpg,.jpeg,.png,.pdf" className="hidden" onChange=${e => addFiles(e.target.files)} /></div>
        </div>

        <div className="mt-4 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-[10px] font-medium text-[#777168]"><span className="inline-flex items-center gap-1.5"><${LockKeyhole} size=${12} className="text-gold/70" /> Processamento protegido</span><span className="inline-flex items-center gap-1.5"><${RefreshCw} size=${12} className="text-gold/70" /> Duplicidades identificadas</span><span className="inline-flex items-center gap-1.5"><${ClipboardCheck} size=${12} className="text-gold/70" /> Conferência humana quando necessária</span></div>

        ${files.length ? html`<div className="mt-7 overflow-hidden rounded-xl border border-gold/15 bg-surface shadow-gold">
          <div className="flex flex-wrap items-center justify-between gap-4 border-b border-white/[.07] px-5 py-4"><div><div className="flex items-center gap-2"><h3 className="text-sm font-semibold text-[#ECE9E2]">Documentos selecionados</h3><span className="rounded-full border border-gold/20 bg-gold/[.06] px-2 py-0.5 text-[10px] font-bold text-gold">${files.length}</span></div><p className="mt-1 text-[11px] text-[#7F7A72]">O lote será enviado em até três fluxos simultâneos.</p></div><div className="flex items-center gap-2">${successCount ? html`<button type="button" onClick=${() => setFiles(current => current.filter(item => !['done', 'duplicate'].includes(item.state)))} className="focus-ring rounded-lg px-3 py-2 text-[11px] font-semibold text-[#8F8A82] transition hover:bg-white/[.04] hover:text-[#E0E0E0]">Limpar concluídos</button>` : null}<button type="button" onClick=${uploadAll} disabled=${!readyCount || sending} className="focus-ring inline-flex items-center gap-2 rounded-xl bg-gold px-4 py-2.5 text-xs font-extrabold text-[#121212] transition duration-200 hover:bg-[#E3C55C] disabled:cursor-not-allowed disabled:opacity-35"><${sending ? LoaderCircle : UploadCloud} className=${sending ? 'spin' : ''} size=${15} />${sending ? 'Protocolando lote…' : `Iniciar triagem ${readyCount || ''}`}</button></div></div>
          <div className="divide-y divide-white/[.06]" aria-live="polite">
            ${files.map(item => html`<div key=${item.id} className="upload-row flex items-center gap-4 px-5 py-4 transition hover:bg-white/[.015]">
              <div className=${`grid h-11 w-11 shrink-0 place-items-center rounded-xl border ${['invalid', 'error'].includes(item.state) ? 'border-red-400/20 bg-red-400/[.07] text-red-300' : 'border-gold/15 bg-gold/[.05] text-gold/80'}`}>${fileIcon(item.file.type, 19)}</div>
              <div className="min-w-0 flex-1"><div className="flex flex-wrap items-center gap-2"><div className="max-w-[520px] truncate text-xs font-semibold text-[#DDD9D1]">${item.file.name}</div>${item.state === 'duplicate' ? html`<span className="rounded border border-gold/20 bg-gold/[.06] px-2 py-0.5 text-[9px] font-bold uppercase tracking-wide text-gold">Já anexado</span>` : null}</div><div className=${`mt-1 text-[10px] ${['invalid', 'error'].includes(item.state) ? 'text-danger' : 'text-[#817C73]'}`}>${item.message || `${formatBytes(item.file.size)} · ${CHANNELS[channel]}`}</div>${item.state === 'uploading' ? html`<div className="mt-2 h-1 w-full max-w-sm overflow-hidden rounded-full bg-white/[.06]"><div className="upload-progress h-full w-2/3 rounded-full bg-gold"></div></div>` : null}</div>
              ${['ready', 'invalid', 'error'].includes(item.state) ? html`<button type="button" aria-label="Remover arquivo" onClick=${() => remove(item.id)} className="focus-ring rounded-lg p-2 text-[#777168] transition hover:bg-white/[.05] hover:text-[#E0E0E0]"><${X} size=${16} /></button>` : null}
              ${item.state === 'uploading' ? html`<${LoaderCircle} className="spin text-gold" size=${19} />` : null}
              ${['done', 'duplicate'].includes(item.state) ? html`<div className="flex items-center gap-2"><span className="success-pop grid h-7 w-7 place-items-center rounded-full bg-emerald-400/10 text-emerald-300"><${item.duplicate ? RotateCcw : Check} size=${15} /></span><${StatusBadge} status=${item.document.status} /></div>` : null}
              ${item.state === 'error' ? html`<${XCircle} className="text-danger" size=${19} />` : null}
            </div>`)}
          </div>
          ${successCount ? html`<div className="flex flex-wrap items-center justify-between gap-3 border-t border-emerald-400/15 bg-emerald-400/[.045] px-5 py-3"><div className="flex items-center gap-2 text-xs font-semibold text-emerald-300"><${CheckCircle2} className="success-pop" size=${16} />${successCount} documento(s) encaminhado(s) para triagem.</div><button type="button" onClick=${onTrack} className="focus-ring inline-flex items-center gap-1.5 text-xs font-bold text-gold transition hover:text-[#E3C55C]">Acompanhar triagem <${ArrowRight} size=${15} /></button></div>` : null}
        </div>` : null}
      </section>`;
    }

    function ProcessSteps({ status }) {
      const steps = [
        { key: 'PENDING', label: 'Recebido' },
        { key: 'PROCESSING', label: 'Leitura inteligente' },
        { key: 'RESULT', label: status === 'NEEDS_REVIEW' ? 'Conferência' : status === 'FAILED' ? 'Falha' : 'Finalizado' }
      ];
      const level = status === 'PENDING' ? 0 : status === 'PROCESSING' ? 1 : 2;
      return html`<div className="mt-4 grid grid-cols-3 gap-1">
        ${steps.map((step, index) => html`<div key=${step.key} className="relative"><div className=${`h-1.5 rounded-full ${index <= level ? (status === 'FAILED' && index === 2 ? 'bg-danger' : 'bg-cyan') : 'bg-slate-200'}`}></div><div className=${`mt-2 truncate text-[10px] font-semibold uppercase tracking-[.08em] ${index <= level ? 'text-ink' : 'text-slate-400'}`}>${step.label}</div></div>`)}
      </div>`;
    }

    function MonitorView({ documents, loading, refresh, onOpenDocument, onReview, canReview }) {
      const active = documents.filter(doc => ['PENDING', 'PROCESSING'].includes(doc.status));
      const attention = documents.filter(doc => ['NEEDS_REVIEW', 'FAILED'].includes(doc.status));
      const recent = documents.filter(doc => doc.status === 'COMPLETED').slice(0, 6);
      const cards = [...active, ...attention].slice(0, 12);
      return html`<section className="enter">
        <div className="mb-7 flex flex-wrap items-end justify-between gap-4"><div><p className="mb-1 text-[10px] font-bold uppercase tracking-[.2em] text-gold">Operação em tempo real</p><h2 className="text-3xl font-semibold tracking-tight text-[#ECE9E2]">Triagem ativa</h2><p className="mt-2 text-sm text-muted">Acompanhe a classificação das provas e documentos anexados aos atendimentos.</p></div><button type="button" onClick=${refresh} className="focus-ring inline-flex items-center gap-2 rounded-xl border border-gold/20 bg-surface px-4 py-2.5 text-xs font-semibold text-[#C8C3B9] transition hover:border-gold/45 hover:text-gold"><${RefreshCw} size=${15} className=${loading ? 'spin' : ''} /> Atualizar triagem</button></div>

        <div className="mb-7 grid gap-4 sm:grid-cols-3">
          <div className="rounded-xl border border-line bg-white p-5 shadow-panel"><div className="flex items-center justify-between"><span className="text-xs font-bold uppercase tracking-[.12em] text-muted">Aguardando</span><div className="rounded-lg bg-slate-100 p-2 text-muted"><${Clock3} size=${17} /></div></div><div className="mt-3 text-3xl font-semibold tabular-nums">${documents.filter(doc => doc.status === 'PENDING').length}</div><p className="mt-1 text-xs text-muted">Na fila durável</p></div>
          <div className="rounded-xl border border-gold/30 bg-gold/[.055] p-5 shadow-panel"><div className="flex items-center justify-between"><span className="text-xs font-bold uppercase tracking-[.12em] text-gold">Em análise</span><div className="rounded-lg bg-gold/10 p-2 text-gold"><${Sparkles} size=${17} /></div></div><div className="mt-3 text-3xl font-semibold tabular-nums text-gold">${documents.filter(doc => doc.status === 'PROCESSING').length}</div><p className="mt-1 text-xs text-muted">Classificação e extração jurídica</p></div>
          <div className="rounded-xl border border-amber-200 bg-amber-50 p-5 shadow-panel"><div className="flex items-center justify-between"><span className="text-xs font-bold uppercase tracking-[.12em] text-amber-800">Pedem atenção</span><div className="rounded-lg bg-amber-100 p-2 text-amber-800"><${AlertTriangle} size=${17} /></div></div><div className="mt-3 text-3xl font-semibold tabular-nums text-amber-800">${attention.length}</div><p className="mt-1 text-xs text-muted">Conferência ou falha</p></div>
        </div>

        <div className="grid gap-6 xl:grid-cols-[1.35fr_.65fr]">
          <div className="overflow-hidden rounded-xl border border-line bg-white shadow-panel"><div className="flex items-center justify-between border-b border-line px-5 py-4"><div><h3 className="font-semibold">Documentos em triagem</h3><p className="mt-0.5 text-xs text-muted">Provas e documentos ainda não concluídos</p></div><span className="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-muted">${cards.length}</span></div>
            ${cards.length ? html`<div className="grid gap-3 p-4 md:grid-cols-2">${cards.map(doc => html`<article key=${doc.id} className="rounded-xl border border-line p-4 transition hover:border-cyan/60 hover:shadow-sm"><div className="flex items-start gap-3"><div className="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-slate-100 text-muted">${fileIcon(doc.mime_type, 19)}</div><div className="min-w-0 flex-1"><button type="button" onClick=${() => onOpenDocument(doc)} className="focus-ring block max-w-full truncate text-left text-sm font-semibold hover:text-cyan-800">${doc.filename_original}</button><p className="mt-1 text-xs text-muted">${CHANNELS[doc.source_channel] || doc.source_channel} · ${relativeTime(doc.created_at)}</p></div><${StatusBadge} status=${doc.status} /></div><${ProcessSteps} status=${doc.status} />${doc.status === 'NEEDS_REVIEW' && canReview ? html`<button type="button" onClick=${onReview} className="focus-ring mt-4 flex w-full items-center justify-center gap-2 rounded-lg bg-amber-50 px-3 py-2 text-xs font-bold text-amber-900 hover:bg-amber-100"><${ClipboardCheck} size=${15} /> Abrir conferência</button>` : null}${doc.status === 'FAILED' ? html`<p className="mt-3 line-clamp-2 text-xs text-danger">${doc.error_message || 'O processamento não pôde ser concluído.'}</p>` : null}</article>`)}</div>` : html`<div className="grid min-h-[290px] place-items-center p-8 text-center"><div><div className="mx-auto grid h-14 w-14 place-items-center rounded-full bg-emerald-50 text-emerald-600"><${CheckCircle2} size=${26} /></div><h4 className="mt-4 font-semibold">Tudo processado</h4><p className="mt-1 text-sm text-muted">Não há documentos aguardando neste momento.</p></div></div>`}
          </div>
          <div className="overflow-hidden rounded-xl border border-line bg-white shadow-panel"><div className="border-b border-line px-5 py-4"><h3 className="font-semibold">Concluídos recentemente</h3><p className="mt-0.5 text-xs text-muted">Últimos resultados prontos</p></div>${recent.length ? html`<div className="divide-y divide-line">${recent.map(doc => html`<button type="button" key=${doc.id} onClick=${() => onOpenDocument(doc)} className="focus-ring flex w-full items-center gap-3 px-5 py-4 text-left hover:bg-slate-50"><div className="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-emerald-50 text-emerald-600"><${FileCheck2} size=${17} /></div><div className="min-w-0 flex-1"><div className="truncate text-sm font-semibold">${doc.filename_suggested || doc.filename_original}</div><div className="mt-0.5 text-xs text-muted">${doc.document_type || 'Documento'} · ${Math.round(doc.confidence_score * 100)}%</div></div><${ChevronRight} size=${16} className="text-slate-300" /></button>`)}</div>` : html`<div className="p-8 text-center text-sm text-muted">Nenhum resultado concluído ainda.</div>`}</div>
        </div>
      </section>`;
    }

    function useDocumentBlob(authHeaders, document) {
      const [url, setUrl] = useState(null);
      const [error, setError] = useState(null);
      useEffect(() => {
        setUrl(null); setError(null);
        if (!document || document.status === 'PURGED') return;
        let active = true;
        let objectUrl;
        fetch(`/api/v1/documents/${document.id}/content`, { headers: authHeaders })
          .then(response => { if (!response.ok) throw new Error('Não foi possível abrir o documento.'); return response.blob(); })
          .then(blob => { if (active) { objectUrl = URL.createObjectURL(blob); setUrl(objectUrl); } })
          .catch(err => active && setError(err.message));
        return () => { active = false; if (objectUrl) URL.revokeObjectURL(objectUrl); };
      }, [authHeaders.Authorization, authHeaders['X-Dev-User'], document?.id]);
      return { url, error };
    }

    function ReviewView({ api, authHeaders, principal, onChanged }) {
      const [document, setDocument] = useState(null);
      const [fields, setFields] = useState({});
      const [docType, setDocType] = useState('');
      const [suggested, setSuggested] = useState('');
      const [notes, setNotes] = useState('');
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState('');
      const { url, error: previewError } = useDocumentBlob(authHeaders, document);

      const claim = useCallback(async () => {
        setBusy(true); setMessage('');
        try {
          const next = await api('/api/v1/review/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          setDocument(next);
          if (next) { setFields(next.extracted_data || {}); setDocType(next.document_type || ''); setSuggested(next.filename_suggested || next.filename_original); setNotes(''); }
          else setMessage('Nenhum documento disponível para conferência.');
          onChanged();
        } catch (err) { setMessage(err.message); }
        finally { setBusy(false); }
      }, [api]);

      useEffect(() => { claim(); }, []);
      useEffect(() => {
        if (!document) return;
        const timer = setInterval(() => api(`/api/v1/review/${document.id}/heartbeat`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => setMessage('A reserva expirou. Recarregue a fila.')), 120000);
        return () => clearInterval(timer);
      }, [document?.id]);

      const submit = async decision => {
        if (!document) return;
        setBusy(true); setMessage('');
        try {
          await api(`/api/v1/review/${document.id}/submit`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision, document_type: docType, filename_suggested: suggested, extracted_data: fields, notes: notes || null }) });
          setDocument(null); onChanged(); await claim();
        } catch (err) { setMessage(err.message); }
        finally { setBusy(false); }
      };

      if (!document) return html`<section className="grid min-h-[65vh] place-items-center"><div className="max-w-md text-center"><div className="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-full border border-gold/25 bg-gold/[.06] text-gold shadow-panel"><${Inbox} size=${28} /></div><h2 className="text-2xl font-semibold text-[#ECE9E2]">Fila de conferência</h2><p className="mt-2 text-sm text-muted">${message || 'Buscando o próximo documento que exige validação…'}</p><button onClick=${claim} disabled=${busy} className="focus-ring mt-5 inline-flex items-center gap-2 rounded-xl bg-gold px-5 py-2.5 text-xs font-extrabold text-[#121212] transition hover:bg-[#E3C55C] disabled:opacity-40"><${busy ? LoaderCircle : RefreshCw} className=${busy ? 'spin' : ''} size=${16} /> Analisar próximo documento</button></div></section>`;

      const changedCount = document ? Object.entries(fields).filter(([key, value]) => (document.extracted_data || {})[key] !== value).length : 0;
      return html`<section className="enter">
        <div className="mb-5 flex flex-wrap items-center justify-between gap-3"><div><p className="text-xs font-bold uppercase tracking-[.18em] text-amber-700">Conferência humana</p><h2 className="mt-1 text-2xl font-semibold">Validar extração</h2></div><div className="flex items-center gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-semibold text-amber-900"><${LockKeyhole} size=${15} /> Reservado para ${principal.name || principal.email || principal.subject}</div></div>
        ${message ? html`<div className="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">${message}</div>` : null}
        <div className="review-grid grid min-h-[650px] grid-cols-[1.15fr_.85fr] overflow-hidden rounded-xl border border-line bg-white shadow-panel">
          <div className="review-preview flex min-h-[580px] flex-col border-r border-line bg-slate-200">
            <div className="flex items-center justify-between border-b border-line bg-white px-4 py-3"><div className="flex min-w-0 items-center gap-2">${fileIcon(document.mime_type, 17)}<span className="truncate text-sm font-semibold">${document.filename_original}</span></div><div className="flex items-center gap-3"><span className="text-xs text-muted">${formatBytes(document.size_bytes)}</span>${url ? html`<a href=${url} target="_blank" rel="noreferrer" aria-label="Abrir documento em nova aba" className="focus-ring rounded-md p-1.5 text-muted hover:bg-slate-100 hover:text-ink"><${ExternalLink} size=${15} /></a>` : null}</div></div>
            <div className="document-canvas grid flex-1 place-items-center overflow-hidden p-5">
              ${previewError ? html`<div className="text-sm text-danger">${previewError}</div>` : !url ? html`<${LoaderCircle} className="spin text-cyan" size=${28} />` : document.mime_type === 'application/pdf' ? html`<iframe title="Documento PDF" src=${url} className="h-full min-h-[560px] w-full rounded-md bg-white"></iframe>` : html`<img src=${url} alt="Documento em conferência" className="max-h-[600px] max-w-full rounded-md bg-white object-contain shadow-panel" />`}
            </div>
          </div>
          <div className="scrollbar-thin overflow-y-auto p-6">
            <div className="mb-6 flex items-center justify-between border-b border-line pb-5"><div><div className="text-xs font-semibold uppercase tracking-[.14em] text-muted">Confiança do modelo</div><div className="mt-1 text-3xl font-semibold text-amber-700">${Math.round(document.confidence_score * 100)}%</div></div><${StatusBadge} status=${document.status} /></div>
            <label className="mb-4 block text-sm font-semibold">Tipo do documento<input value=${docType} onInput=${e => setDocType(e.target.value)} className="mt-1.5 w-full rounded-lg border border-line px-3 py-2.5 font-normal outline-none focus:border-cyan focus:ring-2 focus:ring-cyan/15" /></label>
            <label className="mb-5 block text-sm font-semibold">Nome padronizado<input value=${suggested} onInput=${e => setSuggested(e.target.value)} className="mt-1.5 w-full rounded-lg border border-line px-3 py-2.5 font-normal outline-none focus:border-cyan focus:ring-2 focus:ring-cyan/15" /></label>
            <div className="mb-2 flex items-center justify-between"><div className="flex items-center gap-2"><h3 className="text-sm font-semibold">Campos extraídos</h3>${changedCount ? html`<span className="rounded-full bg-cyan/10 px-2 py-0.5 text-[10px] font-bold text-cyan-800">${changedCount} alterado(s)</span>` : null}</div><button type="button" onClick=${() => setFields(current => ({ ...current, [`campo_${Object.keys(current).length + 1}`]: '' }))} className="focus-ring inline-flex items-center gap-1 text-xs font-semibold text-cyan-700"><${Plus} size=${14} /> Campo</button></div>
            <div className="space-y-3">
              ${Object.entries(fields).map(([key, value]) => html`<div key=${key} className="grid grid-cols-[120px_1fr_32px] items-center gap-2"><label className="truncate text-xs font-medium capitalize text-muted" title=${key}>${key.replaceAll('_', ' ')}</label><input value=${value ?? ''} onInput=${e => setFields(current => ({ ...current, [key]: e.target.value || null }))} className=${`focus-ring w-full rounded-lg border px-3 py-2 text-sm outline-none ${(document.extracted_data || {})[key] !== value ? 'border-cyan bg-cyan/5' : 'border-line'}`} /><button type="button" aria-label=${`Remover ${key}`} onClick=${() => setFields(current => Object.fromEntries(Object.entries(current).filter(([name]) => name !== key)))} className="focus-ring rounded-md p-1.5 text-muted hover:bg-red-50 hover:text-danger"><${X} size=${15} /></button></div>`)}
            </div>
            <label className="mt-5 block text-sm font-semibold">Observação<textarea value=${notes} onInput=${e => setNotes(e.target.value)} rows="3" placeholder="Opcional" className="mt-1.5 w-full resize-none rounded-lg border border-line px-3 py-2 text-sm font-normal outline-none focus:border-cyan"></textarea></label>
            <div className="mt-6 grid grid-cols-[.65fr_1.35fr] gap-3"><button type="button" onClick=${() => submit('REJECT')} disabled=${busy} className="focus-ring rounded-lg border border-red-200 px-4 py-2.5 text-sm font-semibold text-danger hover:bg-red-50 disabled:opacity-40">Rejeitar</button><button type="button" onClick=${() => submit('APPROVE')} disabled=${busy || !docType || !suggested} className="focus-ring inline-flex items-center justify-center gap-2 rounded-lg bg-cyan px-4 py-2.5 text-sm font-bold text-ink hover:bg-cyan/80 disabled:opacity-40"><${busy ? LoaderCircle : FileCheck2} className=${busy ? 'spin' : ''} size=${17} /> Aprovar e próximo</button></div>
          </div>
        </div>
      </section>`;
    }

    function DocumentDrawer({ document, authHeaders, onClose }) {
      const { url, error } = useDocumentBlob(authHeaders, document);
      useEffect(() => {
        if (!document) return;
        const close = event => { if (event.key === 'Escape') onClose(); };
        window.addEventListener('keydown', close);
        return () => window.removeEventListener('keydown', close);
      }, [document?.id]);
      if (!document) return null;
      const fields = Object.entries(document.extracted_data || {});
      return html`<div className="fixed inset-0 z-50 flex justify-end bg-ink/45 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-label="Detalhes do documento" onMouseDown=${event => { if (event.target === event.currentTarget) onClose(); }}>
        <aside className="drawer-panel drawer-enter scrollbar-thin h-full w-[min(680px,94vw)] overflow-y-auto bg-paper shadow-float">
          <div className="sticky top-0 z-10 flex items-center justify-between border-b border-line bg-white/95 px-6 py-4 backdrop-blur"><div className="min-w-0"><p className="text-[10px] font-bold uppercase tracking-[.16em] text-cyan-800">Detalhes do documento</p><h2 className="mt-1 max-w-[500px] truncate text-lg font-semibold">${document.filename_suggested || document.filename_original}</h2></div><button type="button" onClick=${onClose} aria-label="Fechar detalhes" className="focus-ring rounded-lg p-2 text-muted hover:bg-slate-100 hover:text-ink"><${X} size=${20} /></button></div>
          <div className="p-6">
            <div className="mb-5 flex flex-wrap items-center justify-between gap-3"><${StatusBadge} status=${document.status} /><div className="flex items-center gap-2">${url ? html`<a href=${url} target="_blank" rel="noreferrer" className="focus-ring inline-flex items-center gap-2 rounded-lg border border-line bg-white px-3 py-2 text-xs font-semibold hover:border-cyan"><${ExternalLink} size=${15} /> Abrir original</a><a href=${url} download=${document.filename_suggested || document.filename_original} className="focus-ring rounded-lg border border-line bg-white p-2 text-muted hover:border-cyan hover:text-ink" aria-label="Baixar original"><${Download} size=${15} /></a>` : null}</div></div>

            ${document.status !== 'PURGED' ? html`<div className="document-canvas mb-6 grid min-h-[300px] place-items-center overflow-hidden rounded-xl border border-line p-4">${error ? html`<div className="flex items-center gap-2 text-sm text-danger"><${AlertCircle} size=${17} />${error}</div>` : !url ? html`<${LoaderCircle} className="spin text-cyan" size=${26} />` : document.mime_type === 'application/pdf' ? html`<iframe title="Visualização do documento" src=${url} className="h-[430px] w-full rounded-lg bg-white"></iframe>` : html`<img src=${url} alt="Documento original" className="max-h-[430px] max-w-full rounded-lg bg-white object-contain shadow-panel" />`}</div>` : html`<div className="mb-6 rounded-xl border border-line bg-white p-8 text-center text-sm text-muted"><${ShieldCheck} className="mx-auto mb-3" size=${24} />O conteúdo foi descartado conforme a política de retenção.</div>`}

            <div className="grid gap-4 sm:grid-cols-3"><div className="rounded-xl border border-line bg-white p-4"><div className="text-[10px] font-bold uppercase tracking-[.1em] text-muted">Tipo</div><div className="mt-1.5 text-sm font-semibold">${document.document_type || 'Não classificado'}</div></div><div className="rounded-xl border border-line bg-white p-4"><div className="text-[10px] font-bold uppercase tracking-[.1em] text-muted">Confiança</div><div className="mt-1.5 text-sm font-semibold">${document.confidence_score ? `${Math.round(document.confidence_score * 100)}%` : '—'}</div></div><div className="rounded-xl border border-line bg-white p-4"><div className="text-[10px] font-bold uppercase tracking-[.1em] text-muted">Origem</div><div className="mt-1.5 text-sm font-semibold">${CHANNELS[document.source_channel] || document.source_channel}</div></div></div>

            <section className="mt-6 overflow-hidden rounded-xl border border-line bg-white"><div className="flex items-center justify-between border-b border-line px-5 py-4"><h3 className="font-semibold">Campos extraídos</h3><span className="text-xs text-muted">${fields.length} campo(s)</span></div>${fields.length ? html`<dl className="divide-y divide-line">${fields.map(([key, value]) => html`<div key=${key} className="grid grid-cols-[minmax(120px,.65fr)_1.35fr] gap-4 px-5 py-3.5"><dt className="text-xs font-semibold capitalize text-muted">${key.replaceAll('_', ' ')}</dt><dd className="break-words text-sm font-medium">${value ?? '—'}</dd></div>`)}</dl>` : html`<div className="px-5 py-8 text-center text-sm text-muted">Ainda não há campos disponíveis.</div>`}</section>

            <section className="mt-6 rounded-xl border border-line bg-white p-5"><h3 className="mb-4 font-semibold">Rastreabilidade</h3><dl className="grid gap-x-5 gap-y-4 text-sm sm:grid-cols-2"><div><dt className="text-xs text-muted">Recebido em</dt><dd className="mt-1 font-medium">${formatDate(document.created_at)}</dd></div><div><dt className="text-xs text-muted">Processado em</dt><dd className="mt-1 font-medium">${formatDate(document.processed_at)}</dd></div><div><dt className="text-xs text-muted">Modelo</dt><dd className="mt-1 font-medium">${document.model_version || '—'}</dd></div><div><dt className="text-xs text-muted">Prompt</dt><dd className="mt-1 font-medium">${document.prompt_version || '—'}</dd></div><div className="sm:col-span-2"><dt className="text-xs text-muted">ID</dt><dd className="mt-1 break-all font-mono text-xs">${document.id}</dd></div></dl></section>
          </div>
        </aside>
      </div>`;
    }

    function DocumentsView({ documents, loading, api, refresh, onOpen, canAdmin }) {
      const [query, setQuery] = useState('');
      const [status, setStatus] = useState('ALL');
      const [channel, setChannel] = useState('ALL');
      const [error, setError] = useState('');
      const normalizedQuery = query.trim().toLocaleLowerCase('pt-BR');
      const filtered = useMemo(() => documents.filter(doc => {
        const haystack = `${doc.filename_original} ${doc.filename_suggested || ''} ${doc.document_type || ''} ${Object.values(doc.extracted_data || {}).join(' ')}`.toLocaleLowerCase('pt-BR');
        return (status === 'ALL' || doc.status === status) && (channel === 'ALL' || doc.source_channel === channel) && (!normalizedQuery || haystack.includes(normalizedQuery));
      }), [documents, query, status, channel]);
      const retry = async (event, id) => { event.stopPropagation(); setError(''); try { await api(`/api/v1/documents/${id}/retry`, { method: 'POST' }); await refresh(); } catch (err) { setError(err.message); } };
      const clearFilters = () => { setQuery(''); setStatus('ALL'); setChannel('ALL'); };
      return html`<section className="enter">
        <div className="mb-6 flex flex-wrap items-end justify-between gap-4"><div><p className="mb-1 text-[10px] font-bold uppercase tracking-[.2em] text-gold">Base documental</p><h2 className="text-3xl font-semibold tracking-tight text-[#ECE9E2]">Acervo processual</h2><p className="mt-2 text-sm text-muted">Localize provas e documentos por nome, tipo ou dado extraído.</p></div><button type="button" onClick=${refresh} className="focus-ring inline-flex items-center gap-2 rounded-xl border border-gold/20 bg-surface px-4 py-2.5 text-xs font-semibold hover:border-gold/45 hover:text-gold"><${RefreshCw} size=${15} className=${loading ? 'spin' : ''} /> Atualizar acervo</button></div>
        ${error ? html`<div className="mb-4 flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-danger"><${AlertCircle} size=${17} />${error}</div>` : null}
        <div className="mb-4 rounded-xl border border-line bg-white p-3 shadow-panel"><div className="flex flex-wrap gap-3"><label className="relative min-w-[260px] flex-1"><span className="sr-only">Buscar documentos</span><${Search} size=${17} className="absolute left-3 top-2.5 text-muted" /><input value=${query} onInput=${e => setQuery(e.target.value)} placeholder="Buscar nome, CPF, RG, tipo…" className="focus-ring w-full rounded-lg border border-line bg-white py-2 pl-10 pr-3 text-sm outline-none" /></label><label className="relative"><span className="sr-only">Filtrar por status</span><select value=${status} onChange=${e => setStatus(e.target.value)} className="focus-ring rounded-lg border border-line bg-white px-3 py-2 pr-9 text-sm outline-none"><option value="ALL">Todos os status</option>${Object.entries(STATUS).map(([value, item]) => html`<option key=${value} value=${value}>${item.label}</option>`)}</select></label><label><span className="sr-only">Filtrar por canal</span><select value=${channel} onChange=${e => setChannel(e.target.value)} className="focus-ring rounded-lg border border-line bg-white px-3 py-2 pr-9 text-sm outline-none"><option value="ALL">Todos os canais</option>${Object.entries(CHANNELS).map(([value, label]) => html`<option key=${value} value=${value}>${label}</option>`)}</select></label></div></div>
        <div className="mb-3 flex items-center justify-between px-1 text-xs text-muted"><span><strong className="text-ink">${filtered.length}</strong> de ${documents.length} documento(s)</span>${(query || status !== 'ALL' || channel !== 'ALL') ? html`<button type="button" onClick=${clearFilters} className="focus-ring font-semibold text-cyan-800">Limpar filtros</button>` : null}</div>
        <div className="overflow-x-auto rounded-xl border border-line bg-white shadow-panel"><table className="w-full min-w-[900px] border-collapse text-left"><thead><tr className="border-b border-line bg-slate-50 text-xs font-bold uppercase tracking-[.1em] text-muted"><th className="px-5 py-3.5">Documento</th><th className="px-4 py-3.5">Origem</th><th className="px-4 py-3.5">Tipo</th><th className="px-4 py-3.5">Confiança</th><th className="px-4 py-3.5">Status</th><th className="px-4 py-3.5">Recebido</th><th className="w-12"><span className="sr-only">Ações</span></th></tr></thead><tbody className="divide-y divide-line">
          ${filtered.length ? filtered.map(doc => html`<tr key=${doc.id} onClick=${() => onOpen(doc)} tabIndex="0" onKeyDown=${event => { if (event.key === 'Enter') onOpen(doc); }} className="cursor-pointer outline-none transition hover:bg-slate-50 focus:bg-cyan/5"><td className="px-5 py-4"><div className="flex items-center gap-3"><div className="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-slate-100 text-muted">${fileIcon(doc.mime_type, 18)}</div><div className="min-w-0"><div className="max-w-[280px] truncate text-sm font-semibold">${doc.filename_suggested || doc.filename_original}</div><div className="mt-0.5 max-w-[280px] truncate text-xs text-muted">${doc.filename_original} · ${formatBytes(doc.size_bytes)}</div></div></div></td><td className="px-4 py-4 text-sm text-muted">${CHANNELS[doc.source_channel] || doc.source_channel}</td><td className="px-4 py-4 text-sm">${doc.document_type || '—'}</td><td className="px-4 py-4"><div className="flex items-center gap-2"><div className="h-1.5 w-14 overflow-hidden rounded-full bg-slate-100"><div className=${`h-full rounded-full ${doc.confidence_score >= .85 ? 'bg-emerald-500' : 'bg-amber'}`} style=${{ width: `${Math.round(doc.confidence_score * 100)}%` }}></div></div><span className="text-xs font-semibold tabular-nums">${doc.confidence_score ? `${Math.round(doc.confidence_score * 100)}%` : '—'}</span></div></td><td className="px-4 py-4"><${StatusBadge} status=${doc.status} /></td><td className="px-4 py-4 text-xs text-muted">${formatDate(doc.created_at)}</td><td className="px-4 py-4">${doc.status === 'FAILED' && canAdmin ? html`<button type="button" title="Tentar novamente" aria-label="Tentar processar novamente" onClick=${event => retry(event, doc.id)} className="focus-ring rounded-md p-2 text-muted hover:bg-cyan/10 hover:text-cyan-700"><${RotateCcw} size=${16} /></button>` : html`<${ChevronRight} size=${16} className="text-slate-300" />`}</td></tr>`) : html`<tr><td colSpan="7" className="px-5 py-16 text-center"><div className="mx-auto grid h-12 w-12 place-items-center rounded-full bg-slate-100 text-muted"><${Search} size=${22} /></div><h3 className="mt-3 text-sm font-semibold">Nenhum documento encontrado</h3><p className="mt-1 text-xs text-muted">Ajuste os termos ou remova os filtros.</p></td></tr>`}
        </tbody></table></div>
      </section>`;
    }

    function SignInGate({ loading, error, onSignIn }) {
      return html`<main className="grid min-h-screen place-items-center bg-deep p-6"><section className="w-full max-w-md rounded-2xl border border-gold/20 bg-surface p-9 text-center shadow-float"><div className="mx-auto mb-5 grid h-14 w-14 place-items-center rounded-xl border border-gold/35 bg-gold/[.08] text-gold"><${ShieldCheck} size=${25} /></div><p className="text-[9px] font-bold uppercase tracking-[.24em] text-gold">Ambiente jurídico protegido</p><h1 className="mt-3 text-2xl font-semibold text-[#ECE9E2]">DOC Intelligence</h1><p className="mt-3 text-sm leading-6 text-muted">Acesse com sua identidade individual para anexar, conferir e localizar documentos processuais.</p>${error ? html`<div className="mt-5 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-danger">${error}</div>` : null}<button onClick=${onSignIn} disabled=${loading} className="focus-ring mt-6 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gold px-5 py-3 text-xs font-extrabold text-[#121212] transition hover:bg-[#E3C55C] disabled:opacity-50"><${loading ? LoaderCircle : LogIn} className=${loading ? 'spin' : ''} size=${17} /> ${loading ? 'Validando credenciais…' : 'Acessar ambiente seguro'}</button></section></main>`;
    }

    function App() {
      const [view, setView] = useState('upload');
      const [authConfig, setAuthConfig] = useState(null);
      const [manager, setManager] = useState(null);
      const [principal, setPrincipal] = useState(null);
      const [accessToken, setAccessToken] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState('');
      const [documents, setDocuments] = useState([]);
      const [summary, setSummary] = useState({ waiting: 0, claimed: 0 });
      const [loading, setLoading] = useState(false);
      const [serviceError, setServiceError] = useState('');
      const [selectedDocument, setSelectedDocument] = useState(null);
      const developmentAuth = Boolean(authConfig?.auth_disabled);
      const api = useMemo(() => apiClient(accessToken, developmentAuth), [accessToken, developmentAuth]);
      const authHeaders = useMemo(() => accessToken ? { Authorization: `Bearer ${accessToken}` } : developmentAuth ? { 'X-Dev-User': 'dev.operator', 'X-Dev-Roles': 'document.submit,document.read,document.review,document.admin' } : {}, [accessToken, developmentAuth]);
      const canReview = principal?.roles?.some(role => ['document.review', 'document.admin'].includes(role));
      const canAdmin = principal?.roles?.includes('document.admin');

      useEffect(() => {
        let active = true;
        (async () => {
          try {
            const config = await fetch('/api/config').then(response => response.json());
            if (!active) return;
            setAuthConfig(config);
            if (config.auth_disabled) {
              const devApi = apiClient(null, true);
              setPrincipal(await devApi('/api/v1/me'));
              return;
            }
            const oidc = new UserManager({
              authority: config.oidc_issuer,
              client_id: config.oidc_client_id,
              redirect_uri: `${window.location.origin}/`,
              post_logout_redirect_uri: `${window.location.origin}/`,
              response_type: 'code',
              scope: config.oidc_scopes,
              automaticSilentRenew: true,
              userStore: new WebStorageStateStore({ store: window.sessionStorage })
            });
            setManager(oidc);
            let user;
            if (new URLSearchParams(window.location.search).has('code')) {
              user = await oidc.signinRedirectCallback();
              history.replaceState({}, document.title, '/');
            } else {
              user = await oidc.getUser();
            }
            if (user && !user.expired) {
              setAccessToken(user.access_token);
              setPrincipal(await apiClient(user.access_token)('/api/v1/me'));
            }
          } catch (error) { if (active) setAuthError(error.message); }
          finally { if (active) setAuthLoading(false); }
        })();
        return () => { active = false; };
      }, []);

      const signIn = () => manager?.signinRedirect().catch(error => setAuthError(error.message));
      const signOut = () => authConfig?.auth_disabled ? window.location.reload() : manager?.signoutRedirect();

      const refresh = useCallback(async () => {
        if (!principal) return;
        setLoading(true);
        try {
          const [list, queue] = await Promise.all([
            api('/api/v1/documents?limit=200'),
            canReview ? api('/api/v1/review/summary') : Promise.resolve({ waiting: 0, claimed: 0 })
          ]);
          setDocuments(list.items); setSummary(queue); setServiceError('');
        } catch (error) { setServiceError(error.message); }
        finally { setLoading(false); }
      }, [api, principal?.subject, canReview]);

      useEffect(() => { if (!principal) return; refresh(); const timer = setInterval(refresh, 5000); return () => clearInterval(timer); }, [refresh, principal?.subject]);
      useEffect(() => {
        if (!selectedDocument) return;
        const updated = documents.find(item => item.id === selectedDocument.id);
        if (updated && updated.updated_at !== selectedDocument.updated_at) setSelectedDocument(updated);
      }, [documents, selectedDocument?.id]);
      if (!principal) return html`<${SignInGate} loading=${authLoading} error=${authError} onSignIn=${signIn} />`;

      const metrics = {
        today: documents.filter(doc => new Date(doc.created_at).toDateString() === new Date().toDateString()).length,
        processing: documents.filter(doc => ['PENDING', 'PROCESSING'].includes(doc.status)).length,
        completed: documents.filter(doc => doc.status === 'COMPLETED').length
      };
      const pageTitles = {
        upload: 'Anexar autos e documentos',
        monitor: 'Triagem ativa',
        review: 'Fila de conferência',
        documents: 'Acervo processual'
      };

      return html`<div className="app-shell grid min-h-screen grid-cols-[272px_1fr] bg-deep">
        <${Sidebar} view=${view} setView=${setView} principal=${principal} onSignOut=${signOut} reviewCount=${summary.waiting} activeCount=${metrics.processing} />
        <main className="min-w-0">
          <header className="border-b border-gold/10 bg-[#151515]/95 px-7 py-4 backdrop-blur-xl"><div className="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-5"><div><div className="flex items-center gap-2 text-[9px] font-bold uppercase tracking-[.18em] text-[#777168]"><span className=${`h-1.5 w-1.5 rounded-full ${serviceError ? 'bg-danger' : 'bg-emerald-400 shadow-[0_0_9px_rgba(52,211,153,.55)]'}`}></span>${serviceError ? 'Serviço indisponível' : 'Operação segura online'}</div><div className="mt-1.5 text-sm font-semibold text-[#D9D5CC]">${pageTitles[view]}</div></div><div className="desk-metrics grid grid-cols-3 gap-3"><${Metric} label="Recebidos hoje" value=${metrics.today} icon=${Activity} /><${Metric} label="Em triagem" value=${metrics.processing} icon=${Clock3} /><${Metric} label="Concluídos" value=${metrics.completed} icon=${CheckCircle2} /></div></div></header>
          ${serviceError ? html`<div className="border-b border-red-200 bg-red-50 px-7 py-2 text-center text-xs font-medium text-danger">${serviceError}. Tentaremos reconectar automaticamente.</div>` : null}
          <div className="page-pad mx-auto max-w-7xl p-7 lg:p-10">
            ${view === 'upload' ? html`<${UploadView} api=${api} onUploaded=${refresh} onTrack=${() => setView('monitor')} />` : null}
            ${view === 'monitor' ? html`<${MonitorView} documents=${documents} loading=${loading} refresh=${refresh} onOpenDocument=${setSelectedDocument} onReview=${() => setView('review')} canReview=${canReview} />` : null}
            ${view === 'review' && canReview ? html`<${ReviewView} api=${api} authHeaders=${authHeaders} principal=${principal} onChanged=${refresh} />` : null}
            ${view === 'documents' ? html`<${DocumentsView} documents=${documents} loading=${loading} api=${api} refresh=${refresh} onOpen=${setSelectedDocument} canAdmin=${canAdmin} />` : null}
          </div>
        </main>
        <${DocumentDrawer} document=${selectedDocument} authHeaders=${authHeaders} onClose=${() => setSelectedDocument(null)} />
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
